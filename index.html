<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a2b"><title>PENTATHLON TOUCH</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f4f7ff;background:#101a2b}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:16px 14px 48px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:22px;margin:8px 0}small,.muted{color:#aebdd3}button,input,select{font:inherit}button{border:1px solid #40516d;background:#263751;color:white;padding:11px 13px;border-radius:12px;cursor:pointer}button:active{transform:scale(.98)}button.active{background:#2875d5;border-color:#74b4ff}button:disabled{opacity:.4}.panel{background:#1b2940;border:1px solid #34445e;border-radius:16px;padding:14px;margin-top:12px}.tabs,.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.tabs button{flex:1;min-width:80px;padding:10px 4px;font-size:13px}.row input{flex:1;min-width:120px;background:#0e192a;color:white;border:1px solid #52617b;border-radius:10px;padding:12px}.row select{background:#0e192a;color:white;border:1px solid #52617b;border-radius:10px;padding:10px;max-width:100%}.space{justify-content:space-between}.boardwrap{max-width:520px;margin:10px auto;touch-action:manipulation}svg{width:100%;display:block;overflow:visible;touch-action:manipulation}svg [data-hit]{cursor:pointer}svg [data-hit]:active{opacity:.75}.score{font-size:30px;font-weight:800}.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#314564;border-radius:9px;padding:8px 12px;min-width:66px;text-align:center}.pill strong{display:block}.hint{font-size:12px;color:#bac9db;line-height:1.6}.history{max-height:230px;overflow:auto}.entry{border-top:1px solid #34445e;padding:9px 0;font-size:14px}.right{margin-left:auto}.zoomed{max-width:650px}#notice{color:#ffdc87;min-height:18px;font-size:13px}footer{margin-top:16px;font-size:12px;color:#b0bed1} </style></head><body><main><header><div><h1>🎯 PENTATHLON TOUCH</h1><small>タップ入力・端末内保存</small></div><button id="reset">全データ削除</button></header><section class="panel"><div class="row"><input id="name" placeholder="プレーヤー名（最大16人）" maxlength="24"><button id="add">＋ 追加</button></div><div class="row" style="margin-top:10px"><select id="player"></select><button id="remove">選択者を削除</button></div></section><section class="panel"><div class="tabs" id="games"></div><div class="row space" style="margin-top:12px"><div><small>現在の種目 / ラウンド</small><div id="status"></div></div><div style="text-align:right"><small>記録済み3投合計</small><div class="score" id="total">0</div></div></div><p class="hint">ボードをタップすると1投ずつ入力されます。3投入力するとラウンドを確定できます。標準／拡大は表示サイズの切り替えです。</p><div class="row space"><div class="row"><button id="normal" class="active">標準</button><button id="large">拡大</button></div><button id="miss">MISS（0点）</button></div><div id="boardwrap" class="boardwrap"><svg id="board" viewBox="-225 -225 450 450" role="img" aria-label="タップ可能なダーツボード"></svg></div><div id="notice"></div><div class="pills" id="throws"></div><div class="row" style="margin-top:12px"><button id="undo">↶ 1本戻す</button><button id="commit" class="active">3本を確定</button></div></section><section class="panel"><div class="row space"><strong>ラウンド履歴</strong><button id="deleteRound">前ラウンド削除</button></div><div class="history" id="history"></div></section><footer>注：Corks / 301 / Baseball / 501 / Cricket の5種目に対応した入力・記録用アプリです。現段階では各種目の正式なペンタスロン換算点、01のバースト、Cricketのクローズ判定は実装していません。表示する得点はダーツの素点です。</footer></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),KEY='pentathlon-touch-v9',GAMES=['Corks','301','Baseball','501','Cricket'];let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||!Array.isArray(data.players))data={players:[],selected:null,game:GAMES[0],draft:[],zoom:false};data.draft=Array.isArray(data.draft)?data.draft:[];data.game=GAMES.includes(data.game)?data.game:GAMES[0];const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch{note('保存に失敗しました。ブラウザの保存設定をご確認ください。')}};const note=s=>{$('notice').textContent=s};const selected=()=>data.players.find(p=>p.id===data.selected);const rounds=()=>{let p=selected();return p?(p.rounds[data.game]||[]):[]};function render(){const p=selected();$('player').innerHTML='';for(const x of data.players){let o=document.createElement('option');o.value=x.id;o.textContent=x.name;$('player').append(o)}if(p)$('player').value=p.id;$('player').disabled=!p;$('remove').disabled=!p;$('games').innerHTML='';GAMES.forEach(g=>{let b=document.createElement('button');b.textContent=g;b.className=data.game===g?'active':'';b.onclick=()=>{data.game=g;data.draft=[];save();render()};$('games').append(b)});$('status').textContent=data.game+' / '+(rounds().length+1)+' R';$('total').textContent=rounds().flatMap(r=>r).reduce((a,x)=>a+x.score,0);$('throws').innerHTML='';for(let i=0;i<3;i++){let x=data.draft[i],d=document.createElement('div');d.className='pill';d.innerHTML='<small>'+(i+1)+'投目</small><strong>'+(x?x.label+' ('+x.score+')':'—')+'</strong>';$('throws').append(d)}$('commit').disabled=!p||data.draft.length!==3;$('undo').disabled=!data.draft.length;$('deleteRound').disabled=!rounds().length;$('normal').className=data.zoom?'':'active';$('large').className=data.zoom?'active':'';$('boardwrap').className='boardwrap'+(data.zoom?' zoomed':'');$('history').innerHTML='';rounds().slice().reverse().forEach((r,i)=>{let d=document.createElement('div');d.className='entry';d.textContent=(rounds().length-i)+'R：'+r.map(x=>x.label).join(' / ')+' ＝ '+r.reduce((a,x)=>a+x.score,0)+'点';$('history').append(d)});if(!rounds().length)$('history').textContent='まだ履歴はありません。';save()};function hit(label,score){if(!selected()){note('先にプレーヤーを追加してください');return}if(data.draft.length>=3){note('3投入力済みです。「3本を確定」を押してください');return}data.draft.push({label,score});note('');render()};function board(){const svg=$('board'),NS='http://www.w3.org/2000/svg',nums=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];function el(tag,attrs,parent=svg){let e=document.createElementNS(NS,tag);for(let k in attrs)e.setAttribute(k,attrs[k]);parent.append(e);return e}function sector(a,b,ri,ro){let pt=(r,t)=>[r*Math.cos(t),r*Math.sin(t)],p1=pt(ro,a),p2=pt(ro,b),p3=pt(ri,b),p4=pt(ri,a);return `M ${p1} A ${ro} ${ro} 0 0 1 ${p2} L ${p3} A ${ri} ${ri} 0 0 0 ${p4} Z`}el('circle',{r:213,fill:'#101010',stroke:'#7a899b','stroke-width':3});for(let i=0;i<20;i++){let a=(-99+i*18)*Math.PI/180,b=(a+18*Math.PI/180),n=nums[i];[[18,101,'S',i%2?'#e7e5d7':'#25282b'],[101,112,'T',i%2?'#df3541':'#26945c'],[112,170,'S',i%2?'#e7e5d7':'#25282b'],[170,183,'D',i%2?'#df3541':'#26945c']].forEach(([ri,ro,t,color])=>{let e=el('path',{d:sector(a,b,ri,ro),fill:color,stroke:'#9aa1a3','stroke-width':.65,'data-hit':t+n});e.addEventListener('click',()=>hit(t+n,n*(t==='T'?3:t==='D'?2:1)))});let t=(-90+i*18)*Math.PI/180,tx=198*Math.cos(t),ty=198*Math.sin(t);let label=el('text',{x:tx,y:ty,fill:'white','font-size':16,'text-anchor':'middle','dominant-baseline':'middle','pointer-events':'none','font-weight':'bold'});label.textContent=n}let sb=el('circle',{r:18,fill:'#26945c',stroke:'#ddd','stroke-width':1,'data-hit':'SB'});sb.onclick=()=>hit('SB',25);let db=el('circle',{r:8,fill:'#df3541',stroke:'#ddd','stroke-width':1,'data-hit':'DB'});db.onclick=()=>hit('DB',50)}$('add').onclick=()=>{let name=$('name').value.trim();if(!name)return note('名前を入力してください');if(data.players.length>=16)return note('最大16人です');let id='p'+Date.now()+'-'+Math.random().toString(36).slice(2,6);data.players.push({id,name,rounds:{}});data.selected=id;data.draft=[];$('name').value='';note('');render()};$('name').onkeydown=e=>{if(e.key==='Enter')$('add').click()};$('player').onchange=e=>{data.selected=e.target.value;data.draft=[];render()};$('remove').onclick=()=>{let p=selected();if(!p||!confirm(p.name+'の記録を削除しますか？'))return;data.players=data.players.filter(x=>x.id!==p.id);data.selected=data.players[0]?.id||null;data.draft=[];render()};$('normal').onclick=()=>{data.zoom=false;render()};$('large').onclick=()=>{data.zoom=true;render()};$('miss').onclick=()=>hit('MISS',0);$('undo').onclick=()=>{data.draft.pop();note('');render()};$('commit').onclick=()=>{let p=selected();if(!p||data.draft.length!==3)return; (p.rounds[data.game]??=[]).push(data.draft.map(x=>({...x})));data.draft=[];note('ラウンドを保存しました');render()};$('deleteRound').onclick=()=>{let p=selected();if(p&&rounds().length&&confirm('直前のラウンドを削除しますか？')){p.rounds[data.game].pop();render()}};$('reset').onclick=()=>{if(confirm('すべてのプレーヤーと履歴を削除しますか？')){localStorage.removeItem(KEY);data={players:[],selected:null,game:GAMES[0],draft:[],zoom:false};render()}};board();render()})();
</script></body></html>
